# vm-app without a public domain yet: api + frontend over plain HTTP, reachable over
# the PUCP network / VPN. Postgres + Redis live on vm-data, the worker on vm-worker.
#   frontend -> http://<APP_IP>/        api -> http://<APP_IP>:3000
# When a domain + ports 80/443 exist, switch to ../vm-app (Caddy, HTTPS) instead.
# Build context paths assume KronosFrontend is a sibling of this repo.
# Run from this directory:  docker compose --env-file .env up -d --build
services:
  api:
    build:
      context: ../..
      target: api
    env_file: .env
    restart: always
    stop_grace_period: 30s
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ../../../KronosFrontend
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_PUBLIC_URL: ${VITE_PUBLIC_URL}
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api
