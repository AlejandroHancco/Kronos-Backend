name: CI/CD

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npx jest --ci
      - run: npm run build

  images:
    name: Build and publish images (GHCR)
    # Runs in parallel with the tests; the deploy waits for both.
    if: github.ref == 'refs/heads/develop' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: api image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.prefix }}/kronos-api:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=backend
      - name: worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.prefix }}/kronos-worker:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=backend
          # The worker build covers every stage the api uses, so one export caches both.
          cache-to: type=gha,scope=backend,mode=max

  deploy:
    name: Deploy to the PUCP slice
    needs: [test, images]
    # Only pushes/manual runs on develop ever reach the self-hosted runner (never PRs).
    if: github.ref == 'refs/heads/develop' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: self-hosted
    permissions:
      contents: read
      packages: read
    concurrency:
      group: kronos-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Deploy api (app VM) + worker (backend VM)
        run: bash deploy/cicd/deploy-backend.sh "${{ github.sha }}"
        env:
          IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
