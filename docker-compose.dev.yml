services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Optional local Postgres: docker compose -f docker-compose.dev.yml --profile db up -d
  postgres:
    image: postgres:16-alpine
    profiles: ["db"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smartconcrete
    ports:
      - "5432:5432"
